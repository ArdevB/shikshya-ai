# Render Blueprint for the API and AI service. See docs/deployment.md.
# `sync: false` means Render asks you for the value once, and it never lives in this file.
services:
  - type: web
    name: shikshya-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Checks the app without waking the database, so Neon can sleep when nobody is using the site.
    healthCheckPath: /health/live
    # Deployed by the CI workflow's deploy hook once the tests pass, not on every push.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: INTERNAL_KEY
        fromService:
          type: web
          name: shikshya-ai
          envVarKey: INTERNAL_KEY
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: GEMINI_API_KEY
        sync: false
      - key: KHALTI_SECRET_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
  - type: web
    name: shikshya-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/ai/Dockerfile
    dockerContext: ./apps/ai
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # Generated once here. The API takes the same value, and every request must present it.
      - key: INTERNAL_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
