# Optional local Postgres, if you would rather not use Neon. Start with: pnpm db:up
services:
  postgres:
    # Postgres 18 with pgvector, matching the Neon database.
    image: pgvector/pgvector:pg18
    container_name: shikshya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shikshya
      POSTGRES_PASSWORD: shikshya
      POSTGRES_DB: shikshya
    ports:
      - '5432:5432'
    volumes:
      # From Postgres 18 the official image keeps its data under this folder.
      - shikshya-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shikshya']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shikshya-postgres-data:
